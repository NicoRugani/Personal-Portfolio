<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="nr.">
  <style>
    /* Matches the .monogram in styles.css: --accent on --page. An SVG favicon can
       follow the system theme, so the mark stays legible on either tab bar. */
    :root { --mark: #7a42b0; --letters: #fbf8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #cfa8ee; --letters: #1d1722; }
    }
  </style>
  <circle cx="32" cy="32" r="32" fill="var(--mark)" />
  <text
    x="32"
    y="33"
    fill="var(--letters)"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="32"
    font-weight="600"
    letter-spacing="-2"
    text-anchor="middle"
    dominant-baseline="central"
  >nr.</text>
</svg>
